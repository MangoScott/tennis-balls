<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.bg{left:-30px;top:-30px;width:1340px;height:780px;background:url(assets/court.jpg) center/cover;filter:blur(3px) saturate(1.1)}
.shade{left:0;top:0;width:1280px;height:720px;background:linear-gradient(180deg,rgba(8,10,14,.55) 0%,rgba(8,10,14,.35) 45%,rgba(8,10,14,.85) 100%)}
.scott{left:735px;bottom:-80px;height:780px;filter:drop-shadow(0 0 40px rgba(0,0,0,.9))}
.h1{left:48px;top:36px;font-size:74px;line-height:1;color:#DDF247;letter-spacing:2px;text-shadow:0 5px 0 #000}
.row{left:48px;top:128px;display:flex;gap:12px}
.tile{width:98px;height:98px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:66px;box-shadow:0 8px 0 rgba(0,0,0,.45)}
.q{background:#fff;color:#0e1116;transform:translateY(-10px) rotate(-6deg);box-shadow:0 8px 0 rgba(0,0,0,.45),0 0 0 6px #DDF247}
.ball{left:36px;top:300px;width:300px;filter:drop-shadow(0 24px 30px rgba(0,0,0,.75))}
.h2{left:350px;top:292px;font-size:112px;line-height:.98;color:#fff;text-shadow:0 8px 0 #000,0 0 30px rgba(0,0,0,.6)}
.h2 span{color:#DDF247}
</style></head><body><div class="t">
<div class="abs bg"></div><div class="abs shade"></div>
<img class="abs scott" src="assets/scott.png">
<div class="abs h1">WILSON US OPEN</div>
<div class="abs row">
 <div class="tile" style="background:#D8A52E;color:#3A2A00">S</div>
 <div class="tile" style="background:#45B16B;color:#fff">A</div>
 <div class="tile" style="background:#95C23E;color:#2C3A05">B</div>
 <div class="tile" style="background:#F3CC42;color:#463700">C</div>
 <div class="tile" style="background:#EC8A33;color:#fff">D</div>
 <div class="tile" style="background:#E14B3C;color:#fff">F</div>
 <div class="tile q">?</div>
</div>
<img class="abs ball" src="assets/ball.png">
<div class="abs h2">WHERE DOES<br>IT <span>RANK?</span></div>
</div></body></html>
