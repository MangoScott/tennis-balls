<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.bg{left:-30px;top:-30px;width:1340px;height:780px;background:url(assets/court-flipped.jpg) center/cover;filter:blur(3px) saturate(1.1)}
.shade{left:0;top:0;width:1280px;height:720px;background:linear-gradient(180deg,rgba(8,10,14,.6) 0%,rgba(8,10,14,.4) 45%,rgba(8,10,14,.88) 100%)}
.scott{left:735px;bottom:-80px;height:780px;filter:drop-shadow(0 0 40px rgba(0,0,0,.9))}
.h1{left:48px;top:34px;font-size:70px;line-height:1;color:#DDF247;letter-spacing:2px;text-shadow:0 5px 0 #000}
.row{left:48px;top:122px;display:flex;gap:12px;align-items:center}
.tile{width:98px;height:98px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:66px;box-shadow:0 8px 0 rgba(0,0,0,.45)}
.tile.s{width:118px;height:118px;font-size:84px;transform:rotate(-6deg);box-shadow:0 8px 0 rgba(0,0,0,.45),0 0 0 7px #DDF247,0 0 40px rgba(221,242,71,.8)}
.badge{position:absolute;right:-22px;top:-22px;width:56px;height:56px;border-radius:50%;background:#fff;color:#0e1116;font-size:40px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.ball{left:40px;top:300px;width:290px;filter:drop-shadow(0 24px 30px rgba(0,0,0,.75))}
.h2{left:350px;top:292px;font-size:128px;line-height:.95;color:#fff;text-shadow:0 8px 0 #000,0 0 30px rgba(0,0,0,.6);white-space:nowrap}
.h2 span{color:#DDF247}
.half{left:372px;top:520px;width:250px;transform:rotate(10deg);filter:drop-shadow(0 20px 30px rgba(0,0,0,.75))}
</style></head><body><div class="t">
<div class="abs bg"></div><div class="abs shade"></div>
<img class="abs scott" src="assets/scott.png">
<div class="abs h1">WILSON US OPEN</div>
<div class="abs row">
 <div class="tile s" style="background:#D8A52E;color:#3A2A00;position:relative">S<div class="badge">?</div></div>
 <div class="tile" style="background:#45B16B;color:#fff">A</div>
 <div class="tile" style="background:#95C23E;color:#2C3A05">B</div>
 <div class="tile" style="background:#F3CC42;color:#463700">C</div>
 <div class="tile" style="background:#EC8A33;color:#fff">D</div>
 <div class="tile" style="background:#E14B3C;color:#fff">F</div>
</div>
<img class="abs ball" src="assets/ball.png">
<div class="abs h2">BEST BALL<br><span>EVER?</span></div>
<img class="abs half" src="assets/half.png">
</div></body></html>
