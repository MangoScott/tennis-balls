<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Scott Plays Tennis">
  <title>Scott Plays Tennis - can mark</title>
  <defs>
    <clipPath id="b0"><circle cx="256" cy="176" r="50"/></clipPath>
    <clipPath id="b1"><circle cx="256" cy="278" r="50"/></clipPath>
    <clipPath id="b2"><circle cx="256" cy="380" r="50"/></clipPath>
    <linearGradient id="tin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9DEE6"/>
      <stop offset="0.18" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#F2F4F8"/>
      <stop offset="1" stop-color="#C8CFD9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0E4F7A"/>

  <!-- shadow the can casts on the badge -->
  <ellipse cx="256" cy="446" rx="104" ry="16" fill="#062F49" opacity="0.55"/>

  <!-- body -->
  <rect x="172" y="112" width="168" height="330" rx="26" fill="url(#tin)"/>
    <circle cx="256" cy="176" r="50" fill="#CFE04A"/>
    <g clip-path="url(#b0)"><path d="M203.5 176.0C220.5 144.0 239.0 144.0 256.0 176.0s18.5 32.0 52.5 0" fill="none" stroke="#FFFFFF" stroke-width="7"/></g>
    <circle cx="256" cy="278" r="50" fill="#CFE04A"/>
    <g clip-path="url(#b1)"><path d="M203.5 278.0C220.5 246.0 239.0 246.0 256.0 278.0s18.5 32.0 52.5 0" fill="none" stroke="#FFFFFF" stroke-width="7"/></g>
    <circle cx="256" cy="380" r="50" fill="#CFE04A"/>
    <g clip-path="url(#b2)"><path d="M203.5 380.0C220.5 348.0 239.0 348.0 256.0 380.0s18.5 32.0 52.5 0" fill="none" stroke="#FFFFFF" stroke-width="7"/></g>

  <rect x="172" y="408" width="168" height="34" rx="16" fill="#0E4F7A" opacity="0.10"/>

  <!-- pull-off lid -->
  <rect x="158" y="70" width="196" height="54" rx="20" fill="#E4E8EE"/>
  <rect x="158" y="70" width="196" height="54" rx="20" fill="none" stroke="#0E4F7A" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="176" y="86" width="160" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
  <rect x="196" y="132" width="16" height="286" rx="8" fill="#FFFFFF" opacity="0.55"/>
</svg>
