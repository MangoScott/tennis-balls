<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Scott Plays Tennis">
  <title>Scott Plays Tennis — ball mark</title>
  <defs>
    <radialGradient id="felt" cx="34%" cy="28%" r="82%">
      <stop offset="0" stop-color="#E9F477"/>
      <stop offset="52%" stop-color="#CFE04A"/>
      <stop offset="100%" stop-color="#A3B92B"/>
    </radialGradient>
    <clipPath id="ball">
      <circle cx="256" cy="256" r="232"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="232" fill="url(#felt)"/>

  <g clip-path="url(#ball)">
    <!-- groove shadow under the seam gives the felt some depth -->
    <path d="M12 256C92 108 176 108 256 256s164 148 244 0"
          fill="none" stroke="#7E9420" stroke-opacity=".55" stroke-width="34"/>
    <path d="M12 256C92 108 176 108 256 256s164 148 244 0"
          fill="none" stroke="#FFFFFF" stroke-width="22"/>
  </g>

  <!-- crisp edge so the mark holds up on white backgrounds -->
  <circle cx="256" cy="256" r="231" fill="none" stroke="#000000" stroke-opacity=".07" stroke-width="2"/>
</svg>
